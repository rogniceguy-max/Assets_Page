[workspace]
resolver = "3"
members = ["common", "windows-agent", "nas-daemon"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hmac = "0.12"
hex = "0.4"
http = "1.2"
http-body-util = "0.1"
mime = "0.3"
notify = "8.0"
# The Windows transfer agent uses an app-scoped NAS CA; TLS trust is independent of the
# Windows root store and only the configured private NAS CA is trusted by this client.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream", "multipart"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
urlencoding = "2.1"
